# release.yml - a release of Onsay for Windows, made on GitHub when a tag like v0.2.0 is pushed: release.ps1 run with
# that version, its Releases\ folder kept as the run's download. Needs the secret ONSAY_REPO_TOKEN, a token that can
# read the onsay repo, since the core is built from it. Publishing to the feed (src/System/Updates.cs) is the last
# step to add once where the feed lives is decided.
name: release

on:
  push:
    tags: ['v*.*.*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: onsay-desktop
      - uses: actions/checkout@v4
        with:
          repository: brandozer1/onsay
          token: ${{ secrets.ONSAY_REPO_TOKEN }}
          path: onsay
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: dotnet tool install -g vpk --version 1.2.158
      - run: .\onsay-desktop\release.ps1 $env:GITHUB_REF_NAME.TrimStart('v')
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: onsay-windows-${{ github.ref_name }}
          path: onsay-desktop/Releases
